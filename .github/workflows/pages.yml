name: Publish Daejin timetable

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh NEIS timetable when a secret is configured
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        shell: bash
        run: |
          if [ -n "$NEIS_API_KEY" ]; then
            npm run build:pages
          else
            echo "NEIS_API_KEY is not configured. Publishing the included actual timetable."
            node -e "const fs=require('fs');if(!fs.readFileSync('index.html','utf8').includes('id=\"neis-snapshot\"'))process.exit(1)"
          fi
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
